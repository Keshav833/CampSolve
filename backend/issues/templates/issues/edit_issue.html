{% extends "issues/base.html" %}

{% block title %}
Edit Issue
{% endblock %}

{% block content %}

<h2>Edit Issue</h2>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <div class="form-actions">
        <button type="submit">Save Changes</button>
        <a href="{% url 'issue-detail' issue.id %}">Cancel</a>
    </div>

</form>

{% endblock %}
