{% extends "issues/base.html" %}

{% block title %}
Create Issue
{% endblock %}

{% block content %}

<h2>Report a Campus Issue</h2>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <div class="form-actions">
        <button type="submit">Submit Issue</button>
        <a href="{% url 'issue-list' %}">Cancel</a>
    </div>

</form>

{% endblock %}
