{% extends "issues/base.html" %}

{% block title %}
Delete Issue
{% endblock %}

{% block content %}

<h2>Delete Issue</h2>

<p>
    Are you sure you want to delete:
    <strong>{{ issue.title }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>
</form>

<a href="{% url 'issue-detail' issue.id %}">
    Cancel
</a>

{% endblock %}
