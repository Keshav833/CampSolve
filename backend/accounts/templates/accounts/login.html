{% extends "issues/base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="page-heading">
    <h2>Login</h2>
</div>

{% if error %}
    <p class="error">{{ error }}</p>
{% endif %}

<form method="POST">

    {% csrf_token %}

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <div class="form-actions">
        <button type="submit">Login</button>
        <a href="{% url 'register' %}">Create an account</a>
    </div>

</form>

{% endblock %}
